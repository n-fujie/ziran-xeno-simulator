name: Core and scientific runtime
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run bench
      - run: npm run check:presets
      - run: npm run check:api
      - run: npm run test:comparison
      - run: node scripts/scientific-comparison.ts --out /tmp/scientific-comparison.json --receipts-dir /tmp/scientific-evidence
      - run: node scripts/scientific-comparison.ts --out /tmp/scientific-comparison-repeat.json --verify-against /tmp/scientific-comparison.json
      # Storage layout must not change scientific results: the full comparison with segment rotation reproduces retained v2.
      - run: node scripts/scientific-comparison.ts --out /tmp/scientific-comparison-segmented.json --receipts-dir /tmp/scientific-evidence-segmented --segment-bytes 131072 --verify-against results/scientific-cycle/v2-comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: scientific-comparison
          path: |
            /tmp/scientific-comparison.json
            /tmp/scientific-comparison-repeat.json
            /tmp/scientific-comparison-segmented.json
            /tmp/scientific-evidence-segmented
            /tmp/scientific-evidence
